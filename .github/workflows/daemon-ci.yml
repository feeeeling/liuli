name: Daemon compatibility

on:
  push:
    paths:
      - "daemon/**"
      - "scripts/daemon-windows.ps1"
      - ".github/workflows/daemon-ci.yml"
  pull_request:
    paths:
      - "daemon/**"
      - "scripts/daemon-windows.ps1"
      - ".github/workflows/daemon-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: daemon/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Check Windows entry point
        if: runner.os == 'Windows'
        shell: powershell
        run: '& ../scripts/daemon-windows.ps1 -Action Check'
      - name: Typecheck, test, build and smoke test
        if: runner.os != 'Windows'
        run: |
          npm run typecheck
          npm test
          npm run build
          npm run smoke
