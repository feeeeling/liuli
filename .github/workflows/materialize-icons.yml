name: Materialize icons
on:
  push:
    paths:
      - "**/*.png.b64"
      - "**/*.png.b64.part*"
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Join b64 parts
        run: |
          set -euo pipefail
          DIR=app/Resources
          shopt -s nullglob
          for base in AppIcon-foreground-L2-512.png.b64 AppIcon-foreground-L2-1024.png.b64 AppIcon-1024.png.b64; do
            parts=("$DIR"/"$base".part*)
            if [[ ${#parts[@]} -gt 0 ]]; then
              cat "$DIR"/"$base".part* >"$DIR/$base"
              rm -f "$DIR"/"$base".part*
              echo "joined $DIR/$base"
            fi
          done
      - name: Decode b64 PNGs
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' f; do
            out="${f%.b64}"
            mkdir -p "$(dirname "$out")"
            base64 -d "$f" > "$out"
            rm "$f"
            found=1
            echo "materialized $out"
          done < <(find . -name '*.png.b64' -print0)
          if [[ "$found" -eq 0 ]]; then
            echo "No .png.b64 files"
          fi
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: materialize PNG icons from b64"
