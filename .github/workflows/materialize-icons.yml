name: Materialize icons
on:
  push:
    paths:
      - "**/*.png.b64"
      - "**/*.png.b64.part*"
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Join AppIcon b64 parts
        run: |
          set -euo pipefail
          DIR=app/Resources
          shopt -s nullglob
          parts=("$DIR"/AppIcon-1024.png.b64.part*)
          if [[ ${#parts[@]} -gt 0 ]]; then
            cat "$DIR"/AppIcon-1024.png.b64.part* >"$DIR/AppIcon-1024.png.b64"
            rm -f "$DIR"/AppIcon-1024.png.b64.part*
            echo "joined AppIcon-1024.png.b64"
          fi
      - name: Decode b64 PNGs
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' f; do
            out="${f%.b64}"
            mkdir -p "$(dirname "$out")"
            base64 -d "$f" > "$out"
            rm "$f"
            found=1
            echo "materialized $out"
          done < <(find . -name '*.png.b64' -print0)
          if [[ "$found" -eq 0 ]]; then
            echo "No .png.b64 files"
          fi
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: materialize PNG icons from b64"
