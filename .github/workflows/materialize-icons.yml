name: Materialize icons
on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.png.b64"
      - "scripts/join-l2-b64.sh"
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Join b64 parts (only when complete)
        run: |
          set -euo pipefail
          DIR=app/Resources
          shopt -s nullglob
          join_if_complete() {
            local base="$1"
            local expected="$2"
            local parts=("$DIR"/"$base".part*)
            local n=${#parts[@]}
            if [[ "$n" -eq 0 ]]; then
              echo "no parts for $base"
              return 0
            fi
            if [[ "$n" -ne "$expected" ]]; then
              echo "incomplete parts for $base: have $n expected $expected — skipping join"
              return 0
            fi
            cat "$DIR"/"$base".part* >"$DIR/$base"
            rm -f "$DIR"/"$base".part*
            echo "joined $DIR/$base from $n parts"
          }
          join_if_complete AppIcon-foreground-L2-512.png.b64 12
          join_if_complete AppIcon-foreground-L2-1024.png.b64 110
          join_if_complete AppIcon-1024.png.b64 7
      - name: Decode b64 PNGs
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' f; do
            out="${f%.b64}"
            mkdir -p "$(dirname "$out")"
            base64 -d "$f" > "$out"
            rm "$f"
            found=1
            echo "materialized $out"
          done < <(find . -name '*.png.b64' -print0)
          if [[ "$found" -eq 0 ]]; then
            echo "No .png.b64 files"
          fi
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: materialize PNG icons from b64"
